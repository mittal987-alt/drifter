[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The URL is read from the DATABASE_URL environment variable in migrations/env.py.
# This placeholder is intentionally left here so offline mode still works
# when DATABASE_URL is not set; it will be overridden at runtime.
sqlalchemy.url = sqlite:///./year_in_drift.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
